<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MANGA — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#080d18;
  --navy2:#0c1321;
  --navy3:#111a2a;

  --gold:#c9a24d;
  --gold-light:#ecd39a;

  --cream:#f4efe4;
  --muted:rgba(244,239,228,.58);
  --muted2:rgba(244,239,228,.36);

  --line:rgba(201,162,77,.20);
  --line-strong:rgba(201,162,77,.34);
  --line-soft:rgba(244,239,228,.08);

  --green:#83c995;
  --green-bg:rgba(131,201,149,.09);

  --red:#d98585;
  --red-bg:rgba(217,133,133,.08);

  --blue:#8caedb;
  --blue-bg:rgba(140,174,219,.08);

  --c-new:#6d97ea;
  --c-confirmed:#86dba0;
  --c-cancelled:#cf5f5c;

  --shadow:0 24px 70px rgba(0,0,0,.28);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:var(--navy);
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(201,162,77,.12),
      transparent 36%
    ),
    linear-gradient(
      180deg,
      #0a101c 0%,
      #070c15 100%
    );

  color:var(--cream);
  font-family:"DM Sans",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   LOGIN
========================= */

#loginView{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;
}

.login-card{
  position:relative;

  width:min(430px,100%);

  padding:44px;

  border:1px solid var(--line);
  border-radius:26px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  box-shadow:var(--shadow);

  backdrop-filter:blur(24px);
}

.login-card::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:inherit;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(201,162,77,.08),
      transparent 45%
    );
}

.login-mark{
  position:relative;

  width:60px;
  height:60px;

  margin:0 auto 24px;

  border:1px solid var(--gold);
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold-light);

  font-family:Fraunces,serif;
  font-size:25px;

  box-shadow:
    0 0 0 7px rgba(201,162,77,.035),
    0 12px 35px rgba(0,0,0,.25);
}

.login-card h1{
  position:relative;

  text-align:center;

  font-family:Fraunces,serif;
  font-size:40px;
  font-weight:400;

  letter-spacing:-1px;
}

.login-sub{
  position:relative;

  margin:9px 0 30px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
  line-height:1.5;
}

.field{
  display:flex;
  flex-direction:column;

  gap:8px;

  margin-bottom:16px;
}

.field label{
  color:var(--muted);

  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
  width:100%;

  border:1px solid var(--line-soft);
  border-radius:12px;

  background:rgba(255,255,255,.035);

  color:var(--cream);

  outline:none;

  padding:13px 14px;

  transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    transform .25s ease;
}

.field input::placeholder,
.field textarea::placeholder{
  color:rgba(244,239,228,.28);
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--gold);

  background:rgba(255,255,255,.055);

  box-shadow:
    0 0 0 3px rgba(201,162,77,.07);
}

.field select option{
  background:#101827;
  color:var(--cream);
}

.login-btn{
  width:100%;

  border:0;
  border-radius:12px;

  padding:14px;

  margin-top:8px;

  background:
    linear-gradient(
      180deg,
      var(--gold-light),
      var(--gold)
    );

  color:#080d18;

  font-weight:600;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.login-btn:hover:not(:disabled){
  transform:translateY(-1px);

  box-shadow:
    0 10px 30px rgba(201,162,77,.16);
}

.login-error{
  min-height:20px;

  margin-top:14px;

  color:#e89b9b;

  font-size:12px;

  line-height:1.45;

  text-align:center;
}

/* =========================
   APP
========================= */

#dashView{
  display:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;

  border-bottom:1px solid var(--line);

  background:rgba(8,13,24,.88);

  backdrop-filter:blur(18px);
}

.topbar-inner{
  width:min(1240px,calc(100% - 36px));

  min-height:74px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.brand{
  display:flex;
  align-items:center;

  gap:12px;
}

.brand-symbol{
  width:38px;
  height:38px;

  border:1px solid var(--gold);
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold-light);

  font-family:Fraunces,serif;

  box-shadow:
    0 0 0 5px rgba(201,162,77,.025);
}

.brand-text strong{
  display:block;

  font-family:Fraunces,serif;

  font-size:18px;
  font-weight:400;

  letter-spacing:.5px;
}

.brand-text span{
  display:block;

  margin-top:2px;

  color:var(--muted2);

  font-size:9px;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.top-actions{
  display:flex;
  align-items:center;

  gap:8px;
}

.top-btn{
  border:1px solid var(--line);

  background:rgba(255,255,255,.025);

  color:var(--cream);

  border-radius:999px;

  padding:9px 14px;

  font-size:11px;

  transition:
    border-color .25s ease,
    color .25s ease,
    background .25s ease,
    transform .2s ease;
}

.top-btn:hover:not(:disabled){
  border-color:var(--gold);

  color:var(--gold-light);

  transform:translateY(-1px);
}

.top-btn.primary{
  background:var(--gold);

  color:#080d18;

  border-color:var(--gold);

  font-weight:600;
}

.top-btn.loading{
  pointer-events:none;
}

.container{
  width:min(1240px,calc(100% - 36px));

  margin:0 auto;

  padding:46px 0 90px;
}

/* =========================
   HEADINGS
========================= */

.page-heading{
  display:flex;
  align-items:end;
  justify-content:space-between;

  gap:20px;

  margin-bottom:32px;
}

.eyebrow{
  color:var(--gold);

  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  margin-bottom:9px;
}

.page-heading h1{
  font-family:Fraunces,serif;

  font-size:clamp(40px,5vw,60px);

  font-weight:400;

  line-height:.98;

  letter-spacing:-1px;
}

.heading-description{
  margin-top:11px;

  color:var(--muted);

  font-size:13px;

  line-height:1.5;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-top:52px;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:18px;
}

.section-header h2{
  font-family:Fraunces,serif;

  font-size:29px;

  font-weight:400;

  letter-spacing:-.3px;
}

.section-count{
  color:var(--gold-light);

  font-size:10px;

  border:1px solid var(--line);

  border-radius:999px;

  padding:6px 11px;

  background:rgba(201,162,77,.035);
}

/* =========================
   RESERVATIONS
========================= */

.reservation-list{
  display:grid;

  gap:15px;
}

.reservation-card{
  position:relative;

  overflow:hidden;

  border:1px solid var(--line-soft);

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.048),
      rgba(255,255,255,.014)
    );

  box-shadow:
    0 14px 45px rgba(0,0,0,.14);

  padding:23px;

  transition:
    border-color .25s ease,
    transform .25s ease,
    box-shadow .25s ease;
}

.reservation-card:hover{
  border-color:rgba(201,162,77,.18);

  box-shadow:
    0 18px 55px rgba(0,0,0,.20);
}

.reservation-card.status-new{
  border-left:2px solid rgba(140,174,219,.65);
}

.reservation-card.status-confirmed{
  border-left:2px solid rgba(131,201,149,.65);
}

.reservation-card.status-cancelled{
  border-left:2px solid rgba(217,133,133,.65);
}

.reservation-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding-bottom:19px;

  border-bottom:1px solid var(--line-soft);
}

.customer{
  display:flex;
  align-items:center;

  gap:14px;

  min-width:0;
}

.customer-avatar{
  flex:0 0 auto;

  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--line);

  color:var(--gold-light);

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(201,162,77,.14),
      rgba(201,162,77,.045)
    );

  font-family:Fraunces,serif;

  font-size:20px;
}

.customer-info{
  min-width:0;
}

.customer-info h3{
  font-family:Fraunces,serif;

  font-size:22px;

  font-weight:400;

  line-height:1.1;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.customer-info a{
  display:inline-block;

  margin-top:5px;

  color:var(--muted);

  font-size:12px;

  transition:color .2s ease;
}

.customer-info a:hover{
  color:var(--gold-light);
}

/* =========================
   STATUS
========================= */

.status-wrap{
  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:7px;

  flex:0 0 auto;
}

.status-label{
  color:var(--muted2);

  font-size:8px;

  letter-spacing:1.6px;

  text-transform:uppercase;
}

.status-select{
  min-width:146px;

  height:38px;

  text-align:center;
  text-align-last:center;

  appearance:none;

  border:1px solid var(--line);

  border-radius:999px;

  padding:0 36px 0 16px;

  color:var(--cream);

  background:
    linear-gradient(
      45deg,
      transparent 50%,
      var(--gold-light) 50%
    )
    calc(100% - 16px) 50% / 5px 5px no-repeat,

    linear-gradient(
      135deg,
      var(--gold-light) 50%,
      transparent 50%
    )
    calc(100% - 12px) 50% / 5px 5px no-repeat,

    rgba(201,162,77,.075);

  outline:none;

  font-size:10px;

  cursor:pointer;

  transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    opacity .2s ease;
}

.status-select:hover{
  border-color:rgba(201,162,77,.42);
}

.status-select:focus{
  border-color:var(--gold);

  box-shadow:
    0 0 0 3px rgba(201,162,77,.07);
}

.status-select:disabled{
  opacity:.55;
}

.status-select.status-new{
  border-color:rgba(140,174,219,.34);

  background-color:var(--blue-bg);
}

.status-select.status-confirmed{
  border-color:rgba(131,201,149,.34);

  background-color:var(--green-bg);
}

.status-select.status-cancelled{
  border-color:rgba(217,133,133,.34);

  background-color:var(--red-bg);
}

.status-select option{
  background:#101827;

  color:var(--cream);
}

/* =========================
   RESERVATION INFO
========================= */

.reservation-info{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-top:17px;
}

.info-cell{
  min-width:0;

  padding:14px;

  border:1px solid var(--line-soft);

  border-radius:14px;

  background:rgba(0,0,0,.12);

  transition:
    border-color .2s ease,
    background .2s ease;
}

.info-cell:hover{
  border-color:rgba(201,162,77,.13);

  background:rgba(0,0,0,.16);
}

.info-label{
  display:block;

  color:var(--muted2);

  font-size:8px;

  letter-spacing:1.4px;

  text-transform:uppercase;

  margin-bottom:7px;
}

.info-value{
  color:var(--cream);

  font-size:12px;

  line-height:1.45;

  word-break:break-word;
}

.info-value.is-empty{
  color:var(--muted2);

  font-style:italic;
}

.message-cell{
  margin-top:10px;

  padding:14px;

  border:1px solid var(--line-soft);

  border-radius:14px;

  background:rgba(0,0,0,.12);
}

.message-cell .info-value{
  white-space:pre-wrap;
}

.reservation-time{
  margin-top:13px;

  color:var(--muted2);

  font-size:9px;

  letter-spacing:.45px;
}

/* =========================
   RANGE TABS
========================= */

.range-tabs{
  position:relative;

  display:inline-flex;

  padding:4px;

  border:1px solid var(--line);

  border-radius:999px;

  background:rgba(255,255,255,.025);
}

.range-tab{
  position:relative;
  z-index:1;

  border:0;

  background:none;

  color:var(--muted);

  border-radius:999px;

  padding:9px 15px;

  font-size:11px;

  white-space:nowrap;

  transition:color .25s ease;
}

.range-tab:hover{
  color:var(--cream);
}

.range-tab.active{
  color:#080d18;

  font-weight:600;
}

.range-pill{
  position:absolute;

  top:4px;
  bottom:4px;
  left:0;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      var(--gold-light),
      var(--gold)
    );

  box-shadow:
    0 6px 18px rgba(201,162,77,.18);

  transition:
    transform .35s cubic-bezier(.2,.8,.2,1),
    width .35s cubic-bezier(.2,.8,.2,1);
}

.range-caption{
  display:block;

  margin-top:9px;

  color:var(--muted2);

  font-size:10px;

  letter-spacing:.4px;

  text-align:right;
}

/* =========================
   STATS
========================= */

.stat-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:12px;
}

.stat-card{
  position:relative;

  overflow:hidden;

  display:flex;
  flex-direction:column;

  gap:10px;

  min-width:0;

  padding:18px 18px 16px;

  border:1px solid var(--line-soft);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );

  color:var(--cream);

  text-align:left;

  transition:
    border-color .25s ease,
    transform .25s ease,
    box-shadow .25s ease,
    opacity .25s ease;
}

.stat-card::before{
  content:"";

  position:absolute;
  inset:0;

  opacity:0;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 85% 0%,
      var(--tone-bg),
      transparent 60%
    );

  transition:opacity .3s ease;
}

.stat-card:hover{
  transform:translateY(-2px);

  border-color:var(--line);
}

.stat-card.active{
  border-color:var(--tone);

  box-shadow:
    0 14px 40px rgba(0,0,0,.22),
    inset 0 0 0 1px var(--tone-ring);
}

.stat-card.active::before{
  opacity:1;
}

.stat-grid.filtered .stat-card:not(.active){
  opacity:.62;
}

.stat-grid.filtered .stat-card:not(.active):hover{
  opacity:1;
}

.stat-card[data-status="all"]{
  --tone:var(--gold);
  --tone-bg:rgba(201,162,77,.13);
  --tone-ring:rgba(201,162,77,.25);
}

.stat-card[data-status="new"]{
  --tone:var(--c-new);
  --tone-bg:rgba(109,151,234,.14);
  --tone-ring:rgba(109,151,234,.25);
}

.stat-card[data-status="confirmed"]{
  --tone:var(--c-confirmed);
  --tone-bg:rgba(134,219,160,.12);
  --tone-ring:rgba(134,219,160,.22);
}

.stat-card[data-status="cancelled"]{
  --tone:var(--c-cancelled);
  --tone-bg:rgba(207,95,92,.14);
  --tone-ring:rgba(207,95,92,.25);
}

.stat-top{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;
}

.stat-label{
  display:flex;
  align-items:center;

  gap:8px;

  color:var(--muted);

  font-size:9px;

  letter-spacing:1.6px;

  text-transform:uppercase;
}

.stat-dot{
  position:relative;

  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--tone);
}

.stat-card.attention .stat-dot::after{
  content:"";

  position:absolute;
  inset:-4px;

  border-radius:50%;

  border:1px solid var(--tone);

  animation:ping 1.8s ease-out infinite;
}

@keyframes ping{
  0%{
    transform:scale(.6);
    opacity:.9;
  }

  100%{
    transform:scale(1.9);
    opacity:0;
  }
}

.stat-share{
  color:var(--muted2);

  font-size:10px;

  font-variant-numeric:tabular-nums;
}

.stat-value{
  position:relative;

  font-family:Fraunces,serif;

  font-size:44px;

  font-weight:400;

  line-height:1;

  letter-spacing:-1px;

  font-variant-numeric:tabular-nums;
}

.stat-foot{
  position:relative;

  color:var(--muted2);

  font-size:10px;
}

.stat-bar{
  position:relative;

  display:flex;

  gap:2px;

  height:4px;

  margin-top:2px;

  border-radius:4px;

  overflow:hidden;

  background:rgba(255,255,255,.05);
}

.stat-bar span{
  height:100%;

  border-radius:4px;

  transition:width .6s cubic-bezier(.2,.8,.2,1);
}

.seg-new{
  background:var(--c-new);
}

.seg-confirmed{
  background:var(--c-confirmed);
}

.seg-cancelled{
  background:var(--c-cancelled);
}

/* =========================
   ACTIVITY CHART
========================= */

.activity-card{
  margin-top:12px;

  padding:20px 20px 14px;

  border:1px solid var(--line-soft);

  border-radius:18px;

  background:rgba(255,255,255,.018);
}

.activity-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;

  margin-bottom:16px;
}

.activity-title{
  color:var(--muted);

  font-size:9px;

  letter-spacing:1.6px;

  text-transform:uppercase;
}

.legend{
  display:flex;

  gap:14px;

  flex-wrap:wrap;

  color:var(--muted);

  font-size:10px;
}

.legend span{
  display:flex;
  align-items:center;

  gap:6px;
}

.legend i{
  width:8px;
  height:8px;

  border-radius:2px;
}

.activity-plot{
  position:relative;

  display:flex;
  align-items:flex-end;

  gap:3px;

  height:120px;

  border-bottom:1px solid var(--line-soft);
}

.activity-col{
  position:relative;

  flex:1 1 0;

  min-width:0;

  height:100%;

  display:flex;
  flex-direction:column-reverse;

  gap:2px;

  cursor:default;
}

.activity-col::before{
  content:"";

  position:absolute;
  inset:0 -1px;

  border-radius:6px;

  background:rgba(255,255,255,.035);

  opacity:0;

  transition:opacity .15s ease;
}

.activity-col:hover::before,
.activity-col.hover::before{
  opacity:1;
}

.activity-col span{
  position:relative;

  width:min(100%,22px);

  margin:0 auto;

  border-radius:1px;

  transition:
    height .5s cubic-bezier(.2,.8,.2,1),
    opacity .25s ease;
}

.activity-col span.top{
  border-radius:4px 4px 1px 1px;
}

.activity-plot.dim-new .seg-new,
.activity-plot.dim-confirmed .seg-confirmed,
.activity-plot.dim-cancelled .seg-cancelled{
  opacity:.18;
}

.activity-axis{
  display:flex;
  justify-content:space-between;

  margin-top:8px;

  color:var(--muted2);

  font-size:9px;

/* =========================================

const SUPABASE_URL =

  );


/* =========================================
   ELEMENTS

/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function showToast(message){

  toast.textContent = message;

  toast.classList.add('show');

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {

      toast.classList.remove('show');

    },2400);

}


function formatDate(value){

  if(!value){

    return 'Not specified';

  }

  const date =
    new Date(value + 'T00:00:00');

  if(Number.isNaN(date.getTime())){

    return value;

  }

  return date.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}


function formatTime(value){

  if(!value){

    return 'Not specified';

  }

  return String(value).slice(0,5);

}


function formatCreated(value){

  if(!value){

    return '';

  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){

    return '';

  }

  return date.toLocaleString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


function getInitial(name){

  const value =
    String(name || 'M').trim();

  return value
    ? value.charAt(0).toUpperCase()
    : 'M';

}


function statusClass(status){

  if(status === 'confirmed'){
    return 'status-confirmed';
  }

  if(status === 'cancelled'){
    return 'status-cancelled';
  }

  return 'status-new';

}


/* =========================================
   AUTH
========================================= */

async function checkSession(){

    await supabaseClient.auth.getSession();

    showDashboard();

  }else{

    loginView.style.display = 'flex';
    dashView.style.display = 'none';

}


async function doLogin(){

  loginError.textContent = '';

  const email =

  loginBtn.textContent =

}

}


/* =========================================
   DASHBOARD
========================================= */

let dashboardLoading = false;

function showDashboard(){

  loginView.style.display = 'none';

  dashView.style.display = 'block';

  moveRangePill();

  loadReservations();

}


async function refreshEverything(){

  if(dashboardLoading){
    return;
  }

  dashboardLoading = true;

  refreshBtn.disabled = true;

  refreshBtn.classList.add('loading');

  refreshBtn.textContent =
    '↻ Refreshing…';

  await loadReservations();

  refreshBtn.disabled = false;

  refreshBtn.classList.remove('loading');

  refreshBtn.textContent =
    '↻ Refresh';

  showToast(
    'Dashboard refreshed'
  );

  dashboardLoading = false;

}


/* =========================================
   RESERVATIONS
========================================= */

async function loadReservations(){

  reservationList.innerHTML =
    '<div class="loading">Loading reservations...</div>';

  const { data, error } =
    await supabaseClient
      .from('reservations')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );

  if(error){

    console.error(error);

    reservationList.innerHTML = `

      <div class="empty">

        <strong>
          Something went wrong
        </strong>

        Could not load reservations.

        <br>

        ${escapeHTML(error.message)}

      </div>

    `;

    return;
  }

  allReservations =
    data || [];

  renderDashboard();

}


/* =========================================
   FILTERS & OVERVIEW
========================================= */

const STATUSES =
  ['new','confirmed','cancelled'];

const STATUS_NAMES = {
  all:'All',
  new:'New',
  confirmed:'Confirmed',
  cancelled:'Cancelled'
};

const RANGE_DAYS = {
  today:1,
  '7d':7,
  '30d':30
};

const RANGE_TEXT = {
  today:'today',
  '7d':'in the last 7 days',
  '30d':'in the last 30 days',
  all:'so far'
};

let allReservations = [];

let activeStatus = 'all';

let activeRange = 'today';


function getStatus(item){

  return STATUSES.includes(item.status)
    ? item.status
    : 'new';

}


function startOfDay(date){

  const day =
    new Date(date);

  day.setHours(0,0,0,0);

  return day;

}


function rangeStart(){

  if(activeRange === 'all'){
    return null;
  }

  const start =
    startOfDay(new Date());

  start.setDate(
    start.getDate() -
    (RANGE_DAYS[activeRange] - 1)
  );

  return start;

}


function createdDate(item){

  const date =
    new Date(item.created_at);

  return Number.isNaN(date.getTime())
    ? null
    : date;

}


function inRange(item){

  const start =
    rangeStart();

  if(!start){
    return true;
  }

  const created =
    createdDate(item);

  return Boolean(created) &&
    created >= start;

}


function shortDate(date){

  return date.toLocaleDateString(
    'en-GB',
    {
      day:'numeric',
      month:'short'
    }
  );

}


function renderDashboard(){

  const items =
    allReservations.filter(inRange);

  renderStats(items);

  renderActivity(items);

  renderList();

}


/* ---------- stat cards ---------- */

function animateCount(el,target){

  const from =
    Number(el.textContent) || 0;

  cancelAnimationFrame(el.__countFrame);

  clearTimeout(el.__countDone);

  if(
    from === target ||
    document.hidden ||
    matchMedia('(prefers-reduced-motion: reduce)').matches
  ){
    el.textContent = target;
    return;
  }

  el.__countDone =
    setTimeout(() => {

      cancelAnimationFrame(el.__countFrame);

      el.textContent = target;

    },650);

  const startTime =
    performance.now();

  const duration = 550;

  function step(now){

    const t =
      Math.min(
        Math.max(
          (now - startTime) / duration,
          0
        ),
        1
      );

    const eased =
      1 - Math.pow(1 - t,3);

    el.textContent =
      Math.round(
        from + (target - from) * eased
      );

    if(t < 1){
      el.__countFrame =
        requestAnimationFrame(step);
    }

  }

  el.__countFrame =
    requestAnimationFrame(step);

}


function renderStats(items){

  const counts = {
    all:items.length,
    new:0,
    confirmed:0,
    cancelled:0
  };

  items.forEach(item => {
    counts[getStatus(item)]++;
  });

  const share = status =>
    counts.all
      ? Math.round(
          counts[status] / counts.all * 100
        )
      : 0;

  Object.keys(counts).forEach(status => {

    animateCount(
      statGrid.querySelector(
        `[data-count="${status}"]`
      ),
      counts[status]
    );

    statGrid.querySelector(
      `[data-share="${status}"]`
    ).textContent =
      status === 'all'
        ? ''
        : counts.all
          ? `${share(status)}%`
          : '—';

    const bar =
      statGrid.querySelector(
        `[data-bar="${status}"]`
      );

    if(bar){
      bar.style.width =
        `${share(status)}%`;
    }

  });

  const mix =
    statGrid.querySelector('[data-mix]');

  STATUSES.forEach((status,index) => {

    mix.children[index].style.width =
      counts.all
        ? `${counts[status] / counts.all * 100}%`
        : '0%';

  });

  statGrid
    .querySelector('[data-status="new"]')
    .classList.toggle(
      'attention',
      counts.new > 0
    );

  insightLine.textContent =
    counts.all
      ? `${counts.all} ${
          counts.all === 1
            ? 'request'
            : 'requests'
        } ${RANGE_TEXT[activeRange]} — ${
          counts.confirmed
        } confirmed, ${
          counts.cancelled
        } cancelled, ${
          counts.new
        } waiting for reply.`
      : `No requests ${RANGE_TEXT[activeRange]} yet.`;

  const start =
    rangeStart();

  rangeCaption.textContent =
    activeRange === 'today'
      ? `Since 00:00 · ${shortDate(new Date())}`
      : start
        ? `${shortDate(start)} – ${shortDate(new Date())}`
        : 'Every reservation ever received';

}


/* ---------- activity chart ---------- */

function buildBuckets(items){

  const now =
    new Date();

  const buckets = [];

  const add = (label,from,to) =>
    buckets.push({
      label,
      from,
      to,
      new:0,
      confirmed:0,
      cancelled:0
    });

  if(activeRange === 'today'){

    const day =
      startOfDay(now);

    for(let hour = 0; hour < 24; hour++){

      const from =
        new Date(day);

      from.setHours(hour);

      const to =
        new Date(from);

      to.setHours(hour + 1);

      add(
        `${String(hour).padStart(2,'0')}:00`,
        from,
        to
      );

    }

  }else{

    let days =
      RANGE_DAYS[activeRange];

    if(!days){

      const dates =
        items
          .map(createdDate)
          .filter(Boolean);

      const first =
        dates.length
          ? new Date(Math.min(...dates))
          : now;

      days =
        Math.round(
          (startOfDay(now) - startOfDay(first)) /
          86400000
        ) + 1;

    }

    if(days <= 31){

      const from =
        startOfDay(now);

      from.setDate(
        from.getDate() - (days - 1)
      );

      for(let i = 0; i < days; i++){

        const dayFrom =
          new Date(from);

        dayFrom.setDate(
          from.getDate() + i
        );

        const dayTo =
          new Date(dayFrom);

        dayTo.setDate(
          dayTo.getDate() + 1
        );

        add(
          dayFrom.toLocaleDateString(
            'en-GB',
            {
              weekday:'short',
              day:'numeric',
              month:'short'
            }
          ),
          dayFrom,
          dayTo
        );

      }

    }else{

      const months =
        Math.min(
          Math.ceil(days / 30) + 1,
          12
        );

      for(let i = months - 1; i >= 0; i--){

        const from =
          new Date(
            now.getFullYear(),
            now.getMonth() - i,
            1
          );

        const to =
          new Date(
            now.getFullYear(),
            now.getMonth() - i + 1,
            1
          );

        add(
          from.toLocaleDateString(
            'en-GB',
            {
              month:'long',
              year:'numeric'
            }
          ),
          from,
          to
        );

      }

    }

  }

  items.forEach(item => {

    const created =
      createdDate(item);

    const bucket =
      buckets.find(
        b =>
          created >= b.from &&
          created < b.to
      );

    if(bucket){
      bucket[getStatus(item)]++;
    }

  });

  return buckets;

}


function axisLabel(bucket){

  if(activeRange === 'today'){
    return bucket.label;
  }

  if(bucket.to - bucket.from > 86400000 * 2){

    return bucket.from.toLocaleDateString(
      'en-GB',
      {
        month:'short'
      }
    );

  }

  return shortDate(bucket.from);

}


let chartBuckets = [];

function renderActivity(items){

  chartBuckets =
    buildBuckets(items);

  const max =
    Math.max(
      1,
      ...chartBuckets.map(
        b => b.new + b.confirmed + b.cancelled
      )
    );

  activityTitle.textContent =
    activeRange === 'today'
      ? 'Activity · by hour'
      : chartBuckets.length &&
        chartBuckets[0].to - chartBuckets[0].from > 86400000 * 2
        ? 'Activity · by month'
        : 'Activity · by day';

  activityPlot.innerHTML =
    chartBuckets
      .map((bucket,index) => {

        const visible =
          STATUSES.filter(
            status => bucket[status] > 0
          );

        return `
          <div
            class="activity-col"
            data-index="${index}"
          >
            ${visible
              .map((status,i) => `
                <span
                  class="seg-${status} ${
                    i === visible.length - 1
                      ? 'top'
                      : ''
                  }"
                  style="height:${
                    bucket[status] / max * 100
                  }%"
                ></span>
              `)
              .join('')}
          </div>
        `;

      })
      .join('') +
    (
      items.length
        ? ''
        : `<div class="activity-empty">No requests ${RANGE_TEXT[activeRange]}</div>`
    );

  activityPlot.setAttribute(
    'aria-label',
    `${items.length} reservation requests ${RANGE_TEXT[activeRange]}`
  );

  const first =
    chartBuckets[0];

  const middle =
    chartBuckets[
      Math.floor(chartBuckets.length / 2)
    ];

  const last =
    chartBuckets[chartBuckets.length - 1];

  activityAxis.innerHTML =
    [first,middle,last]
      .filter(
        (bucket,index,list) =>
          bucket &&
          list.indexOf(bucket) === index
      )
      .map(
        bucket =>
          `<span>${escapeHTML(axisLabel(bucket))}</span>`
      )
      .join('');

  syncChartDim();

}


function syncChartDim(){

  STATUSES.forEach(status => {

    activityPlot.classList.toggle(
      `dim-${status}`,
      activeStatus !== 'all' &&
      activeStatus !== status
    );

  });

}


function showChartTip(col,x,y){

  const bucket =
    chartBuckets[col.dataset.index];

  if(!bucket){
    return;
  }

  activityPlot
    .querySelectorAll('.activity-col.hover')
    .forEach(el => el.classList.remove('hover'));

  col.classList.add('hover');

  const total =
    bucket.new +
    bucket.confirmed +
    bucket.cancelled;

  chartTip.innerHTML = `
    <strong>${escapeHTML(bucket.label)} · ${total}</strong>
    ${STATUSES
      .map(status => `
        <div>
          <i class="seg-${status}"></i>
          ${STATUS_NAMES[status]}
          <b>${bucket[status]}</b>
        </div>
      `)
      .join('')}
  `;

  const width =
    chartTip.offsetWidth;

  const height =
    chartTip.offsetHeight;

  chartTip.style.left =
    `${Math.min(
      Math.max(x - width / 2, 8),
      window.innerWidth - width - 8
    )}px`;

  chartTip.style.top =
    `${Math.max(y - height - 14, 8)}px`;

  chartTip.classList.add('show');

}


function hideChartTip(){

  chartTip.classList.remove('show');

  activityPlot
    .querySelectorAll('.activity-col.hover')
    .forEach(el => el.classList.remove('hover'));

}


activityPlot.addEventListener(
  'pointermove',
  event => {

    const col =
      event.target.closest('.activity-col');

    if(!col){
      hideChartTip();
      return;
    }

    showChartTip(
      col,
      event.clientX,
      event.clientY
    );

  }
);

activityPlot.addEventListener(
  'pointerleave',
  hideChartTip
);

window.addEventListener(
  'scroll',
  hideChartTip,
  { passive:true }
);


/* ---------- list ---------- */

function renderList(){

  const visible =
    allReservations.filter(
      item =>
        inRange(item) &&
        (
          activeStatus === 'all' ||
          getStatus(item) === activeStatus
        )
    );

  reservationCount.textContent =
    `${visible.length} ${
      visible.length === 1
        ? 'request'
        : 'requests'
    }`;

  filterChip.classList.toggle(
    'show',
    activeStatus !== 'all'
  );

  filterChip.innerHTML =
    activeStatus === 'all'
      ? ''
      : `<i class="seg-${activeStatus}"></i>${
          STATUS_NAMES[activeStatus]
        } only &nbsp;✕`;

  if(!allReservations.length){

    reservationList.innerHTML = `

      <div class="empty">

        <strong>
          No reservations yet
        </strong>

        New reservation requests
        will appear here.

      </div>

    `;

    return;
  }

  if(!visible.length){

    const label =
      activeStatus === 'all'
        ? ''
        : `${STATUS_NAMES[activeStatus].toLowerCase()} `;

    reservationList.innerHTML = `

      <div class="empty">

        <strong>
          Nothing here
        </strong>

        No ${label}reservations
        ${RANGE_TEXT[activeRange] === 'so far'
          ? 'yet'
          : RANGE_TEXT[activeRange]}.

      </div>

    `;

    return;
  }

  reservationList.innerHTML =
    visible
      .map(renderReservation)
      .join('');

  syncStatusSelects();

}


/* ---------- controls ---------- */

function setStatusFilter(status){

  activeStatus = status;

  statGrid
    .querySelectorAll('.stat-card')
    .forEach(card => {

      const on =
        card.dataset.status === status;

      card.classList.toggle('active',on);

      card.setAttribute(
        'aria-pressed',
        String(on)
      );

    });

  statGrid.classList.toggle(
    'filtered',
    status !== 'all'
  );

  syncChartDim();

  renderList();

}


function moveRangePill(){

  const active =
    rangeTabs.querySelector('.range-tab.active');

  const pill =
    rangeTabs.querySelector('.range-pill');

  if(!active || !active.offsetWidth){
    return;
  }

  pill.style.width =
    `${active.offsetWidth}px`;

  pill.style.transform =
    `translateX(${active.offsetLeft}px)`;

}


statGrid.addEventListener(
  'click',
  event => {

    const card =
      event.target.closest('.stat-card');

    if(!card){
      return;
    }

    const status =
      card.dataset.status;

    setStatusFilter(
      status === activeStatus
        ? 'all'
        : status
    );

  }
);


filterChip.addEventListener(
  'click',
  () => setStatusFilter('all')
);


rangeTabs.addEventListener(
  'click',
  event => {

    const tab =
      event.target.closest('.range-tab');

    if(!tab){
      return;
    }

    activeRange =
      tab.dataset.range;

    rangeTabs
      .querySelectorAll('.range-tab')
      .forEach(el =>
        el.classList.toggle(
          'active',
          el === tab
        )
      );

    moveRangePill();

    renderDashboard();

  }
);


if('ResizeObserver' in window){

  const pillObserver =
    new ResizeObserver(moveRangePill);

  rangeTabs
    .querySelectorAll('.range-tab')
    .forEach(tab =>
      pillObserver.observe(tab)
    );

}else{

  window.addEventListener(
    'resize',
    moveRangePill
  );

}

if(document.fonts){
  document.fonts.ready.then(moveRangePill);
}


/* =========================================
   RESERVATION CARD
========================================= */

function renderReservation(item){

  const name =
    item.name || 'Guest';

  const phone =
    item.phone || 'Not provided';

  const guests =
    item.guests
      ? `${item.guests} ${
          item.guests === 1
            ? 'guest'
            : 'guests'
        }`
      : 'Not specified';

  const date =
    formatDate(
      item.reservation_date
    );

  const time =
    formatTime(
      item.reservation_time
    );

  const message =
    item.message ||
    'No message provided';

  const created =
    formatCreated(
      item.created_at
    );

  const status =
    item.status || 'new';

  const safePhone =
    String(phone)
      .replace(/[^0-9+]/g,'');

  return `

    <article
      class="reservation-card ${statusClass(status)}"
    >

      <div class="reservation-top">

        <div class="customer">

          <div class="customer-avatar">

            ${escapeHTML(
              getInitial(name)
            )}

          </div>


          <div class="customer-info">

            <h3>
              ${escapeHTML(name)}
            </h3>

            ${
              safePhone
              ? `
                <a
                  href="tel:${escapeHTML(safePhone)}"
                >
                  ${escapeHTML(phone)}
                </a>
              `
              : `
                <span
                  style="
                    color:var(--muted2);
                    font-size:12px;
                  "
                >
                  No phone number
                </span>
              `
            }

          </div>

        </div>


        <div class="status-wrap">

          <span class="status-label">
            Reservation Status
          </span>

          <select
            class="status-select ${statusClass(status)}"
            data-id="${escapeHTML(item.id)}"
          >

            <option
              value="new"
              ${status === 'new'
                ? 'selected'
                : ''}
            >
              New
            </option>

            <option
              value="confirmed"
              ${status === 'confirmed'
                ? 'selected'
                : ''}
            >
              Confirmed
            </option>

            <option
              value="cancelled"
              ${status === 'cancelled'
                ? 'selected'
                : ''}
            >
              Cancelled
            </option>

          </select>

        </div>

      </div>


      <div class="reservation-info">

        <div class="info-cell">

          <span class="info-label">
            Guests
          </span>

          <div class="info-value">
            ${escapeHTML(guests)}
          </div>

        </div>


        <div class="info-cell">

          <span class="info-label">
            Reservation Date
          </span>

          <div class="info-value">
            ${escapeHTML(date)}
          </div>

        </div>


        <div class="info-cell">

          <span class="info-label">
            Reservation Time
          </span>

          <div class="info-value">
            ${escapeHTML(time)}
          </div>

        </div>


        <div class="info-cell">

          <span class="info-label">
            Phone
          </span>

          <div class="info-value">
            ${escapeHTML(phone)}
          </div>

        </div>

      </div>


      <div class="message-cell">

        <span class="info-label">
          Message
        </span>

        <div class="info-value ${
          item.message
            ? ''
            : 'is-empty'
        }">${escapeHTML(message)}</div>

      </div>


      <div class="reservation-time">

        Received
        ${escapeHTML(created)}

      </div>

    </article>

  `;

}


/* =========================================
   STATUS VISUALS
========================================= */

function syncStatusSelect(select){

  const value =
    select.value;

  select.classList.remove(
    'status-new',
    'status-confirmed',
    'status-cancelled'
  );

  select.classList.add(
    statusClass(value)
  );

}


function syncStatusSelects(){

  document
    .querySelectorAll('.status-select')
    .forEach(syncStatusSelect);

}


/* =========================================
   UPDATE RESERVATION STATUS
========================================= */

reservationList.addEventListener(
  'change',
  async event => {

    const select =
      event.target.closest(
        '.status-select'
      );

    if(!select){
      return;
    }

    const id =
      select.dataset.id;

    const status =
      select.value;

    syncStatusSelect(select);

    const originalText =
      select.dataset.previousText ||
      select.options[
        select.selectedIndex
      ].text;

    select.dataset.previousText =
      originalText;

    select.disabled = true;

    const card =
      select.closest(
        '.reservation-card'
      );

    if(card){

      card.classList.remove(
        'status-new',
        'status-confirmed',
        'status-cancelled'
      );

      card.classList.add(
        statusClass(status)
      );

    }

    const { error } =
      await supabaseClient
        .from('reservations')
        .update({
          status
        })
        .eq(
          'id',
          id
        );

    select.disabled = false;

    if(error){

      console.error(error);

      showToast(
        'Could not update reservation'
      );

      await loadReservations();

      return;
    }

    const item =
      allReservations.find(
        reservation =>
          String(reservation.id) === id
      );

    if(item){
      item.status = status;
    }

    const items =
      allReservations.filter(inRange);

    renderStats(items);

    renderActivity(items);

    if(
      card &&
      activeStatus !== 'all' &&
      activeStatus !== status
    ){

      card.classList.add('leaving');

      setTimeout(renderList,300);

    }

    showToast(
      `Reservation marked ${status}`
    );

  }
);

   BUTTONS

);

checkSession();
