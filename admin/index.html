<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MANGA — Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#080d18;
  --navy2:#0c1321;
  --navy3:#111a2a;

  --gold:#c9a24d;
  --gold-light:#ecd39a;

  --cream:#f4efe4;
  --muted:rgba(244,239,228,.58);
  --muted2:rgba(244,239,228,.36);

  --line:rgba(201,162,77,.20);
  --line-strong:rgba(201,162,77,.34);
  --line-soft:rgba(244,239,228,.08);

  --green:#83c995;
  --green-bg:rgba(131,201,149,.09);

  --red:#d98585;
  --red-bg:rgba(217,133,133,.08);

  --blue:#8caedb;
  --blue-bg:rgba(140,174,219,.08);

  --shadow:0 24px 70px rgba(0,0,0,.28);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:var(--navy);
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(201,162,77,.12),
      transparent 36%
    ),
    linear-gradient(
      180deg,
      #0a101c 0%,
      #070c15 100%
    );

  color:var(--cream);
  font-family:"DM Sans",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   LOGIN
========================= */

#loginView{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;
}

.login-card{
  position:relative;

  width:min(430px,100%);

  padding:44px;

  border:1px solid var(--line);
  border-radius:26px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  box-shadow:var(--shadow);

  backdrop-filter:blur(24px);
}

.login-card::before{
  content:"";

  position:absolute;
  inset:0;

  border-radius:inherit;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(201,162,77,.08),
      transparent 45%
    );
}

.login-mark{
  position:relative;

  width:60px;
  height:60px;

  margin:0 auto 24px;

  border:1px solid var(--gold);
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold-light);

  font-family:Fraunces,serif;
  font-size:25px;

  box-shadow:
    0 0 0 7px rgba(201,162,77,.035),
    0 12px 35px rgba(0,0,0,.25);
}

.login-card h1{
  position:relative;

  text-align:center;

  font-family:Fraunces,serif;
  font-size:40px;
  font-weight:400;

  letter-spacing:-1px;
}

.login-sub{
  position:relative;

  margin:9px 0 30px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
  line-height:1.5;
}

.field{
  display:flex;
  flex-direction:column;

  gap:8px;

  margin-bottom:16px;
}

.field label{
  color:var(--muted);

  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
  width:100%;

  border:1px solid var(--line-soft);
  border-radius:12px;

  background:rgba(255,255,255,.035);

  color:var(--cream);

  outline:none;

  padding:13px 14px;

  transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    transform .25s ease;
}

.field input::placeholder,
.field textarea::placeholder{
  color:rgba(244,239,228,.28);
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--gold);

  background:rgba(255,255,255,.055);

  box-shadow:
    0 0 0 3px rgba(201,162,77,.07);
}

.field select option{
  background:#101827;
  color:var(--cream);
}

.login-btn{
  width:100%;

  border:0;
  border-radius:12px;

  padding:14px;

  margin-top:8px;

  background:
    linear-gradient(
      180deg,
      var(--gold-light),
      var(--gold)
    );

  color:#080d18;

  font-weight:600;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.login-btn:hover:not(:disabled){
  transform:translateY(-1px);

  box-shadow:
    0 10px 30px rgba(201,162,77,.16);
}

.login-error{
  min-height:20px;

  margin-top:14px;

  color:#e89b9b;

  font-size:12px;

  line-height:1.45;

  text-align:center;
}

/* =========================
   APP
========================= */

#dashView{
  display:none;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;

  border-bottom:1px solid var(--line);

  background:rgba(8,13,24,.88);

  backdrop-filter:blur(18px);
}

.topbar-inner{
  width:min(1240px,calc(100% - 36px));

  min-height:74px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.brand{
  display:flex;
  align-items:center;

  gap:12px;
}

.brand-symbol{
  width:38px;
  height:38px;

  border:1px solid var(--gold);
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold-light);

  font-family:Fraunces,serif;

  box-shadow:
    0 0 0 5px rgba(201,162,77,.025);
}

.brand-text strong{
  display:block;

  font-family:Fraunces,serif;

  font-size:18px;
  font-weight:400;

  letter-spacing:.5px;
}

.brand-text span{
  display:block;

  margin-top:2px;

  color:var(--muted2);

  font-size:9px;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.top-actions{
  display:flex;
  align-items:center;

  gap:8px;
}

.top-btn{
  border:1px solid var(--line);

  background:rgba(255,255,255,.025);

  color:var(--cream);

  border-radius:999px;

  padding:9px 14px;

  font-size:11px;

  transition:
    border-color .25s ease,
    color .25s ease,
    background .25s ease,
    transform .2s ease;
}

.top-btn:hover:not(:disabled){
  border-color:var(--gold);

  color:var(--gold-light);

  transform:translateY(-1px);
}

.top-btn.primary{
  background:var(--gold);

  color:#080d18;

  border-color:var(--gold);

  font-weight:600;
}

.top-btn.loading{
  pointer-events:none;
}

.container{
  width:min(1240px,calc(100% - 36px));

  margin:0 auto;

  padding:46px 0 90px;
}

/* =========================
   HEADINGS
========================= */

.page-heading{
  display:flex;
  align-items:end;
  justify-content:space-between;

  gap:20px;

  margin-bottom:32px;
}

.eyebrow{
  color:var(--gold);

  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  margin-bottom:9px;
}

.page-heading h1{
  font-family:Fraunces,serif;

  font-size:clamp(40px,5vw,60px);

  font-weight:400;

  line-height:.98;

  letter-spacing:-1px;
}

.heading-description{
  margin-top:11px;

  color:var(--muted);

  font-size:13px;

  line-height:1.5;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-top:52px;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:18px;
}

.section-header h2{
  font-family:Fraunces,serif;

  font-size:29px;

  font-weight:400;

  letter-spacing:-.3px;
}

.section-count{
  color:var(--gold-light);

  font-size:10px;

  border:1px solid var(--line);

  border-radius:999px;

  padding:6px 11px;

  background:rgba(201,162,77,.035);
}

/* =========================
   RESERVATIONS
========================= */

.reservation-list{
  display:grid;

  gap:15px;
}

.reservation-card{
  position:relative;

  overflow:hidden;

  border:1px solid var(--line-soft);

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.048),
      rgba(255,255,255,.014)
    );

  box-shadow:
    0 14px 45px rgba(0,0,0,.14);

  padding:23px;

  transition:
    border-color .25s ease,
    transform .25s ease,
    box-shadow .25s ease;
}

.reservation-card:hover{
  border-color:rgba(201,162,77,.18);

  box-shadow:
    0 18px 55px rgba(0,0,0,.20);
}

.reservation-card.status-new{
  border-left:2px solid rgba(140,174,219,.65);
}

.reservation-card.status-confirmed{
  border-left:2px solid rgba(131,201,149,.65);
}

.reservation-card.status-cancelled{
  border-left:2px solid rgba(217,133,133,.65);
}

.reservation-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:18px;

  padding-bottom:19px;

  border-bottom:1px solid var(--line-soft);
}

.customer{
  display:flex;
  align-items:center;

  gap:14px;

  min-width:0;
}

.customer-avatar{
  flex:0 0 auto;

  width:48px;
  height:48px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--line);

  color:var(--gold-light);

  background:
    radial-gradient(
      circle at 35% 30%,
      rgba(201,162,77,.14),
      rgba(201,162,77,.045)
    );

  font-family:Fraunces,serif;

  font-size:20px;
}

.customer-info{
  min-width:0;
}

.customer-info h3{
  font-family:Fraunces,serif;

  font-size:22px;

  font-weight:400;

  line-height:1.1;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.customer-info a{
  display:inline-block;

  margin-top:5px;

  color:var(--muted);

  font-size:12px;

  transition:color .2s ease;
}

.customer-info a:hover{
  color:var(--gold-light);
}

/* =========================
   STATUS
========================= */

.status-wrap{
  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:7px;

  flex:0 0 auto;
}

.status-label{
  color:var(--muted2);

  font-size:8px;

  letter-spacing:1.6px;

  text-transform:uppercase;
}

.status-select{
  min-width:146px;

  height:38px;

  text-align:center;
  text-align-last:center;

  appearance:none;

  border:1px solid var(--line);

  border-radius:999px;

  padding:0 36px 0 16px;

  color:var(--cream);

  background:
    linear-gradient(
      45deg,
      transparent 50%,
      var(--gold-light) 50%
    )
    calc(100% - 16px) 50% / 5px 5px no-repeat,

    linear-gradient(
      135deg,
      var(--gold-light) 50%,
      transparent 50%
    )
    calc(100% - 12px) 50% / 5px 5px no-repeat,

    rgba(201,162,77,.075);

  outline:none;

  font-size:10px;

  cursor:pointer;

  transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    opacity .2s ease;
}

.status-select:hover{
  border-color:rgba(201,162,77,.42);
}

.status-select:focus{
  border-color:var(--gold);

  box-shadow:
    0 0 0 3px rgba(201,162,77,.07);
}

.status-select:disabled{
  opacity:.55;
}

.status-select.status-new{
  border-color:rgba(140,174,219,.34);

  background-color:var(--blue-bg);
}

.status-select.status-confirmed{
  border-color:rgba(131,201,149,.34);

  background-color:var(--green-bg);
}

.status-select.status-cancelled{
  border-color:rgba(217,133,133,.34);

  background-color:var(--red-bg);
}

.status-select option{
  background:#101827;

  color:var(--cream);
}

/* =========================
   RESERVATION INFO
========================= */

.reservation-info{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-top:17px;
}

.info-cell{
  min-width:0;

  padding:14px;

  border:1px solid var(--line-soft);

  border-radius:14px;

  background:rgba(0,0,0,.12);

  transition:
    border-color .2s ease,
    background .2s ease;
}

.info-cell:hover{
  border-color:rgba(201,162,77,.13);

  background:rgba(0,0,0,.16);
}

.info-label{
  display:block;

  color:var(--muted2);

  font-size:8px;

  letter-spacing:1.4px;

  text-transform:uppercase;

  margin-bottom:7px;
}

.info-value{
  color:var(--cream);

  font-size:12px;

  line-height:1.45;

  word-break:break-word;
}

.info-value.empty{
  color:var(--muted2);

  font-style:italic;
}

.message-cell{
  margin-top:10px;

  padding:14px;

  border:1px solid var(--line-soft);

  border-radius:14px;

  background:rgba(0,0,0,.12);
}

.message-cell .info-value{
  white-space:pre-wrap;
}

.reservation-time{
  margin-top:13px;

  color:var(--muted2);

  font-size:9px;

  letter-spacing:.45px;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
  padding:48px 20px;

  text-align:center;

  border:1px dashed var(--line-soft);

  border-radius:18px;

  color:var(--muted2);

  font-size:12px;

  line-height:1.6;

  background:rgba(255,255,255,.012);
}

.empty strong{
  display:block;

  margin-bottom:5px;

  color:var(--muted);

  font-family:Fraunces,serif;

  font-size:20px;

  font-weight:400;
}

.loading{
  padding:35px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.loading::after{
  content:"";

  display:inline-block;

  width:10px;
  height:10px;

  margin-left:8px;

  border:1px solid var(--gold);

  border-top-color:transparent;

  border-radius:50%;

  vertical-align:-1px;

  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;

  left:50%;
  bottom:24px;

  transform:
    translate(-50%,20px)
    scale(.98);

  opacity:0;

  pointer-events:none;

  z-index:500;

  min-width:190px;

  max-width:calc(100% - 30px);

  padding:12px 18px;

  border:1px solid var(--line);

  border-radius:999px;

  background:
    rgba(17,26,42,.94);

  color:var(--cream);

  box-shadow:var(--shadow);

  font-size:11px;

  text-align:center;

  transition:
    opacity .3s ease,
    transform .3s ease;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0)
    scale(1);
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .reservation-info{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:620px){

  .topbar-inner{
    width:min(100% - 24px,1240px);

    min-height:68px;
  }

  .top-actions{
    gap:5px;
  }

  .top-btn{
    padding:8px 10px;

    font-size:9px;
  }

  .top-btn:first-child{
    display:none;
  }

  .container{
    width:min(100% - 24px,1240px);

    padding-top:30px;

    padding-bottom:65px;
  }

  .page-heading{
    align-items:flex-start;

    flex-direction:column;

    margin-bottom:25px;
  }

  .page-heading h1{
    font-size:44px;
  }

  .section{
    margin-top:42px;
  }

  .section-header{
    margin-bottom:14px;
  }

  .section-header h2{
    font-size:26px;
  }

  .reservation-card{
    padding:17px;

    border-radius:18px;
  }

  .reservation-top{
    align-items:flex-start;

    flex-direction:column;

    gap:15px;
  }

  .customer{
    width:100%;
  }

  .customer-info h3{
    font-size:20px;
  }

  .status-wrap{
    width:100%;
  }

  .status-select{
    width:100%;
  }

  .reservation-info{
    grid-template-columns:
      1fr 1fr;
  }

  .info-cell{
    padding:13px;
  }

}

@media(max-width:390px){

  .reservation-info{
    grid-template-columns:1fr;
  }

  .brand-text span{
    display:none;
  }

  .brand-text strong{
    font-size:16px;
  }

  .brand-symbol{
    width:34px;
    height:34px;
  }

  .login-card{
    padding:30px 22px;
  }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginView">

  <div class="login-card">

    <div class="login-mark">M</div>

    <h1>Manga</h1>

    <p class="login-sub">
      Admin Panel — sign in to manage MANGA
    </p>

    <div class="field">
      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="admin@example.com"
        autocomplete="email"
      >
    </div>

    <div class="field">
      <label>Password</label>

      <input
        id="pw"
        type="password"
        placeholder="••••••••"
        autocomplete="current-password"
      >
    </div>

    <button
      class="login-btn"
      id="loginBtn"
    >
      Sign In
    </button>

    <div
      class="login-error"
      id="loginError"
    ></div>

  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div id="dashView">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">

        <div class="brand-symbol">
          M
        </div>

        <div class="brand-text">

          <strong>MANGA</strong>

          <span>
            Admin Console
          </span>

        </div>

      </div>


      <div class="top-actions">

        <a
          href="../index.html"
          class="top-btn"
        >
          Open Site
        </a>

        <button
          class="top-btn"
          id="refreshBtn"
        >
          ↻ Refresh
        </button>

        <button
          class="top-btn primary"
          id="signOutBtn"
        >
          Sign Out
        </button>

      </div>

    </div>

  </header>


  <main class="container">

    <div class="page-heading">

      <div>

        <div class="eyebrow">
          MANGA / CONTROL
        </div>

        <h1>
          Dashboard
        </h1>

        <p class="heading-description">
          Manage reservations.
        </p>

      </div>

    </div>


    <!-- =====================
         RESERVATIONS
    ====================== -->

    <section class="section">

      <div class="section-header">

        <h2>
          Reservations
        </h2>

        <span
          class="section-count"
          id="reservationCount"
        >
          0 requests
        </span>

      </div>

      <div
        class="reservation-list"
        id="reservationList"
      >

        <div class="loading">
          Loading reservations...
        </div>

      </div>

    </section>


  </main>

</div>


<div id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  'https://famncvtbvlalztkpsaro.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_HV-V501FNugJnclZqK8_IQ__kq8KABm';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const loginView =
  document.getElementById('loginView');

const dashView =
  document.getElementById('dashView');

const loginError =
  document.getElementById('loginError');

const loginBtn =
  document.getElementById('loginBtn');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('pw');

const reservationList =
  document.getElementById('reservationList');

const reservationCount =
  document.getElementById('reservationCount');

const toast =
  document.getElementById('toast');

const refreshBtn =
  document.getElementById('refreshBtn');


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function showToast(message){

  toast.textContent = message;

  toast.classList.add('show');

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {

      toast.classList.remove('show');

    },2400);

}


function formatDate(value){

  if(!value){

    return 'Not specified';

  }

  const date =
    new Date(value + 'T00:00:00');

  if(Number.isNaN(date.getTime())){

    return value;

  }

  return date.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}


function formatTime(value){

  if(!value){

    return 'Not specified';

  }

  return String(value).slice(0,5);

}


function formatCreated(value){

  if(!value){

    return '';

  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){

    return '';

  }

  return date.toLocaleString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


function getInitial(name){

  const value =
    String(name || 'M').trim();

  return value
    ? value.charAt(0).toUpperCase()
    : 'M';

}


function statusClass(status){

  if(status === 'confirmed'){
    return 'status-confirmed';
  }

  if(status === 'cancelled'){
    return 'status-cancelled';
  }

  return 'status-new';

}


/* =========================================
   AUTH
========================================= */

async function checkSession(){

  const { data } =
    await supabaseClient.auth.getSession();

  if(data.session){

    showDashboard();

  }else{

    loginView.style.display = 'flex';
    dashView.style.display = 'none';

  }

}


async function doLogin(){

  loginError.textContent = '';

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email || !password){

    loginError.textContent =
      'Enter your email and password.';

    return;
  }

  loginBtn.disabled = true;

  loginBtn.textContent =
    'Signing in…';

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    loginBtn.disabled = false;

    loginBtn.textContent =
      'Sign In';

    loginError.textContent =
      error.message;

    return;
  }

  loginBtn.textContent =
    'Signed in ✓';

  showDashboard();

}


async function signOut(){

  const { error } =
    await supabaseClient.auth.signOut();

  if(error){

    showToast(
      'Could not sign out'
    );

    return;
  }

  loginView.style.display = 'flex';

  dashView.style.display = 'none';

  emailInput.value = '';
  passwordInput.value = '';

  loginBtn.disabled = false;

  loginBtn.textContent =
    'Sign In';

}


/* =========================================
   DASHBOARD
========================================= */

let dashboardLoading = false;

function showDashboard(){

  loginView.style.display = 'none';

  dashView.style.display = 'block';

  loadReservations();

}


async function refreshEverything(){

  if(dashboardLoading){
    return;
  }

  dashboardLoading = true;

  refreshBtn.disabled = true;

  refreshBtn.classList.add('loading');

  refreshBtn.textContent =
    '↻ Refreshing…';

  await loadReservations();

  refreshBtn.disabled = false;

  refreshBtn.classList.remove('loading');

  refreshBtn.textContent =
    '↻ Refresh';

  showToast(
    'Dashboard refreshed'
  );

  dashboardLoading = false;

}


/* =========================================
   RESERVATIONS
========================================= */

async function loadReservations(){

  reservationList.innerHTML =
    '<div class="loading">Loading reservations...</div>';

  const { data, error } =
    await supabaseClient
      .from('reservations')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );

  if(error){

    console.error(error);

    reservationList.innerHTML = `

      <div class="empty">

        <strong>
          Something went wrong
        </strong>

        Could not load reservations.

        <br>

        ${escapeHTML(error.message)}

      </div>

    `;

    return;
  }

  const reservations =
    data || [];

  reservationCount.textContent =
    `${reservations.length} ${
      reservations.length === 1
        ? 'request'
        : 'requests'
    }`;

  if(!reservations.length){

    reservationList.innerHTML = `

      <div class="empty">

        <strong>
          No reservations yet
        </strong>

        New reservation requests
        will appear here.

      </div>

    `;

    return;
  }

  reservationList.innerHTML =
    reservations
      .map(renderReservation)
      .join('');

  syncStatusSelects();

}


/* =========================================
   RESERVATION CARD
========================================= */

function renderReservation(item){

  const name =
    item.name || 'Guest';

  const phone =
    item.phone || 'Not provided';

  const guests =
    item.guests
      ? `${item.guests} ${
          item.guests === 1
            ? 'guest'
            : 'guests'
        }`
      : 'Not specified';

  const date =
    formatDate(
      item.reservation_date
    );

  const time =
    formatTime(
      item.reservation_time
    );

  const message =
    item.message ||
    'No message provided';

  const created =
    formatCreated(
      item.created_at
    );

  const status =
    item.status || 'new';

  const safePhone =
    String(phone)
      .replace(/[^0-9+]/g,'');

  return `

    <article
      class="reservation-card ${statusClass(status)}"
    >

      <div class="reservation-top">

        <div class="customer">

          <div class="customer-avatar">

            ${escapeHTML(
              getInitial(name)
            )}

          </div>


          <div class="customer-info">

            <h3>
              ${escapeHTML(name)}
            </h3>

            ${
              safePhone
              ? `
                <a
                  href="tel:${escapeHTML(safePhone)}"
                >
                  ${escapeHTML(phone)}
                </a>
              `
              : `
                <span
                  style="
                    color:var(--muted2);
                    font-size:12px;
                  "
                >
                  No phone number
                </span>
              `
            }

          </div>

        </div>


        <div class="status-wrap">

          <span class="status-label">
            Reservation Status
          </span>

          <select
            class="status-select ${statusClass(status)}"
            data-id="${escapeHTML(item.id)}"
          >

            <option
              value="new"
              ${status === 'new'
                ? 'selected'
                : ''}
            >
              New
            </option>

            <option
              value="confirmed"
              ${status === 'confirmed'
                ? 'selected'
                : ''}
            >
              Confirmed
            </option>

            <option
              value="cancelled"
              ${status === 'cancelled'
                ? 'selected'
                : ''}
            >
              Cancelled
            </option>

          </select>

        </div>

      </div>


      <div class="reservation-info">

        <div class="info-cell">

          <span class="info-label">
            Guests
          </span>

          <div class="info-value">
            ${escapeHTML(guests)}
          </div>

        </div>


        <div class="info-cell">

          <span class="info-label">
            Reservation Date
          </span>

          <div class="info-value">
            ${escapeHTML(date)}
          </div>

        </div>


        <div class="info-cell">

          <span class="info-label">
            Reservation Time
          </span>

          <div class="info-value">
            ${escapeHTML(time)}
          </div>

        </div>


        <div class="info-cell">

          <span class="info-label">
            Phone
          </span>

          <div class="info-value">
            ${escapeHTML(phone)}
          </div>

        </div>

      </div>


      <div class="message-cell">

        <span class="info-label">
          Message
        </span>

        <div class="info-value ${
          item.message
            ? ''
            : 'empty'
        }">

          ${escapeHTML(message)}

        </div>

      </div>


      <div class="reservation-time">

        Received
        ${escapeHTML(created)}

      </div>

    </article>

  `;

}


/* =========================================
   STATUS VISUALS
========================================= */

function syncStatusSelect(select){

  const value =
    select.value;

  select.classList.remove(
    'status-new',
    'status-confirmed',
    'status-cancelled'
  );

  select.classList.add(
    statusClass(value)
  );

}


function syncStatusSelects(){

  document
    .querySelectorAll('.status-select')
    .forEach(syncStatusSelect);

}


/* =========================================
   UPDATE RESERVATION STATUS
========================================= */

reservationList.addEventListener(
  'change',
  async event => {

    const select =
      event.target.closest(
        '.status-select'
      );

    if(!select){
      return;
    }

    const id =
      select.dataset.id;

    const status =
      select.value;

    syncStatusSelect(select);

    const originalText =
      select.dataset.previousText ||
      select.options[
        select.selectedIndex
      ].text;

    select.dataset.previousText =
      originalText;

    select.disabled = true;

    const card =
      select.closest(
        '.reservation-card'
      );

    if(card){

      card.classList.remove(
        'status-new',
        'status-confirmed',
        'status-cancelled'
      );

      card.classList.add(
        statusClass(status)
      );

    }

    const { error } =
      await supabaseClient
        .from('reservations')
        .update({
          status
        })
        .eq(
          'id',
          id
        );

    select.disabled = false;

    if(error){

      console.error(error);

      showToast(
        'Could not update reservation'
      );

      await loadReservations();

      return;
    }

    showToast(
      `Reservation marked ${status}`
    );

  }
);


/* =========================================
   BUTTONS
========================================= */

loginBtn.addEventListener(
  'click',
  doLogin
);


passwordInput.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Enter'){

      doLogin();

    }

  }
);


emailInput.addEventListener(
  'keydown',
  event => {

    if(event.key === 'Enter'){

      doLogin();

    }

  }
);


document
  .getElementById('signOutBtn')
  .addEventListener(
    'click',
    signOut
  );


refreshBtn.addEventListener(
  'click',
  refreshEverything
);


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
  (_event, session) => {

    if(session){

      showDashboard();

    }else{

      loginView.style.display =
        'flex';

      dashView.style.display =
        'none';

    }

  }
);


/* =========================================
   START
========================================= */

checkSession();

</script>

</body>
</html>
